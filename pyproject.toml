[project]
name = "ask-rafael"
version = "0.1.0"
description = "One-page CV with an agent that answers questions from a markdown knowledge base"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.3",
    "langsmith>=0.3",
    "python-frontmatter>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",      # what fastapi's TestClient runs on
    "uvicorn>=0.32",    # local dev server
    "python-dotenv>=1.0",
    "ruff>=0.8",
]

# An application deployed from a checkout, not a distributable — so no build
# backend. The `api` package is imported by path, the way Vercel loads it.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
